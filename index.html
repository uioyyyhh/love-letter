<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>小公主給你一封信 ❤️</title>

<style>

body{
    margin:0;
    background:linear-gradient(135deg,#ffd1dc,#ffc0cb);
    font-family:"Microsoft JhengHei";
    text-align:center;
    overflow-x:hidden;
}

#home{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    color:#ff4d6d;
}

button{
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:15px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
    box-shadow:0 6px 0 #d6336c;
    opacity:0;
    animation:fadeIn 2s forwards;
    animation-delay:1s;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

button:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #d6336c;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

#letter{
    display:none;
    padding:40px 15px;
}

.card{
    max-width:800px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 25px rgba(0,0,0,.2);
    animation:openLetter 1s;
}

@keyframes openLetter{
    from{
        opacity:0;
        transform:scale(0.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

#daysCounter{
    color:#ff4d6d;
    font-size:28px;
    margin-bottom:25px;
}

.photo{
    width:300px;
    height:400px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
    transition:0.5s;
}

#caption{
    margin-top:15px;
    color:#666;
}

.gallery{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
    margin-top:30px;
}

.gallery img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:12px;
}

.heart{
    position:fixed;
    top:-20px;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
    }
}


#fireworkContainer{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:9999;
}

.bigHeart{

    position:absolute;

    left:0;
    top:0;

    font-size:180px;

    transform:translate(-50%,-50%);

    animation:heartGrow 1.2s forwards;

}
@keyframes heartGrow{

    0%{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(0.1);

    }

    100%{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(15);

    }

}

.fireHeart{

    position:absolute;

    left:0;
    top:0;

    animation:explode 3s forwards;

}

@keyframes explode{

    0%{

        opacity:1;

        transform:
        translate(0,0)
        scale(1);

    }

    100%{

        opacity:0;

        transform:
        translate(
        var(--x),
        var(--y)
        )
        scale(.5);

    }

}
#introStory{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    font-size:60px;

    color:white;

    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        #ffd1dc,
        #ffc0cb
    );

    text-shadow:
    0 0 10px #fff,
    0 0 20px #ff69b4,
    0 0 40px #ff69b4;

    opacity:0;

    transition:1s;

    z-index:99999;
}
</style>
</head>

<body>

<div id="fireworkContainer"></div>

<div id="home">

<h1>💌 小公主這是給你的一封信💌</h1>

<p>
ㄆㄐㄐ有些話想對你說...
</p>

<button onclick="openLetter(event)">
📩 打開信件
</button>

</div>

<div id="letter">

<div class="card">

<h1>❤️ hello 小公主 ❤️</h1>

<h2 id="daysCounter">
1089 天前(大摡2023/11/8)，我們的故事開始了 ❤️
</h2>

<img
id="slide"
class="photo"
src="images/photo1.jpeg">

<p id="caption">
回憶 1 ❤️
</p>

<p id="loveText"></p>

<h2>
🎬 我們的回憶
</h2>

<video
controls
width="80%"
style="
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.2);
">

<source
src="video/like.mp4"
type="video/mp4">

</video>

<br><br>

<button onclick="showFinal()">
💌 最後還有一句話...
</button>

<div id="finalMessage" style="display:none;">

<h1>
❤️ 願意和我一起走下去嗎 ❤️
</h1>

<button id="yesBtn">
❤️ K阿
</button>

<button id="noBtn">
😝 去吃大便
</button>

</div>

</div>

</div>

<audio id="music" loop>
<source src="music/music.mp3">
</audio>
<script>
function startHeartFirework(event){

    const container =
    document.getElementById(
    "fireworkContainer"
    );

    const bigHeart =
    document.createElement("div");

    bigHeart.className =
    "bigHeart";

    bigHeart.innerHTML = "❤️";

    container.appendChild(
    bigHeart
    );

    setTimeout(()=>{

        bigHeart.remove();

        for(let i=0;i<40;i++){

            const heart =
            document.createElement(
            "div"
            );

            heart.className =
            "fireHeart";

            heart.innerHTML =
            "❤️";
            heart.style.left =
            centerX + "px";

            heart.style.top =
            centerY + "px";
           const t =
            i / 40 * Math.PI * 2;

            const x =
            16 * Math.pow(Math.sin(t),3);

            const y =
            -(13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t));

            heart.style.setProperty(
            "--x",
            x * 45 + "px"
            );

            heart.style.setProperty(
            "--y",
            y * 45 + "px"
            );

            container
            .appendChild(
            heart
            );

            setTimeout(()=>{

                heart.remove();

            },1500);

        }

    },1000);

}
/* 開信 */

function openLetter(event){

    startHeartFirework(event);

    const intro =
    document.createElement("div");

    intro.id = "introStory";

    intro.innerHTML = `
    1089 天前<br>
    我們的故事開始了 ❤️
    `;

    document.body.appendChild(intro);

    /* 文字淡入 */

    setTimeout(()=>{

        intro.style.opacity = "1";

    },1500);

    /* 主畫面提前準備 */

    setTimeout(()=>{

        document.getElementById("home")
        .style.opacity = "0";

    },3500);

    /* 直接進主畫面，不留空檔 */

    setTimeout(()=>{

        document.getElementById("home")
        .style.display = "none";

        document.getElementById("letter")
        .style.display = "block";

        document.getElementById("letter")
        .style.opacity = "0";

        setTimeout(()=>{

            document.getElementById("letter")
            .style.opacity = "1";

        },100);

        document.getElementById("music")
        .play();

        typeWriter();

        intro.remove();

    },4000);

}

/* 打字機效果 */

const text = `

不知道從什麼時候開始。

我開始會想去接近你。

每次和你出門，都提前準備特別久

我覺得跟你出門的時間都過得特別快，

感覺還沒過多久就已經到了回家時間

謝謝你出現在我的生活裡。

1089 天前，

我們從日文社認識了。

而今天，

我想鼓起勇氣告訴你。

❤️ 我喜歡你 陳芊卉 ❤️

`;

let i = 0;

function typeWriter(){

    if(i < text.length){

        document.getElementById("loveText")
        .innerHTML += text.charAt(i);

        i++;

        setTimeout(typeWriter,80);

    }

}
function startHeartFirework(event){

    const centerX = window.innerWidth / 2;

    const centerY = window.innerHeight / 2;

    const container =
    document.getElementById(
    "fireworkContainer"
    );

    const bigHeart =
    document.createElement("div");

    bigHeart.className =
    "bigHeart";

    bigHeart.innerHTML =
    "❤️";

    bigHeart.style.left =
    centerX + "px";

    bigHeart.style.top =
    centerY + "px";

    container.appendChild(bigHeart);

    setTimeout(()=>{

        bigHeart.remove();

        const total = 120;

        for(let i=0;i<total;i++){

            const t =
            i / total * Math.PI * 2;

            const x =
            16 * Math.pow(
            Math.sin(t),3);

            const y =
            -(13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t));

            const heart =
            document.createElement(
            "div"
            );

            heart.className =
            "fireHeart";

            heart.innerHTML =
            "❤️";

            heart.style.left =
            centerX + "px";

            heart.style.top =
            centerY + "px";

            heart.style.setProperty(
            "--x",
            x * 60 + "px"
            );

            heart.style.setProperty(
            "--y",
            y * 60 + "px"
            );

            heart.style.fontSize =
            (50 + Math.random()*40)
            + "px";

            container.appendChild(
            heart
            );

            setTimeout(()=>{

                heart.remove();

            },3000);

        }

    },1200);

}
/* 愛心雨 */

setInterval(()=>{

    const heart =
    document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "❤️";

    heart.style.left =
    Math.random()*100 + "vw";

    heart.style.fontSize =
    (20 + Math.random()*20) + "px";

    heart.style.animationDuration =
    (3 + Math.random()*4) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },7000);

},500);

/* 照片輪播 */

const photos=[

"images/photo1.jpeg",
"images/photo2.jpeg",
"images/photo3.jpeg",
"images/photo4.jpg",
"images/photo5.webp",
"images/photo6.jpg",
"images/photo7.jpg",
"images/photo8.jpg",
"images/photo9.jpg",
"images/photo10.jpg",
"images/photo11.jpg",
"images/photo12.jpg",
"images/photo13.jpg",
"images/photo14.jpg",
"images/photo15.jpg",
"images/photo16.jpg",
"images/photo17.jpg",
"images/photo18.jpg",
"images/photo19.jpg",
"images/photo20.jpg",
"images/photo21.jpg"

];

const captions=[

"回憶 1 ❤️",
"回憶 2 ❤️",
"回憶 3 ❤️",
"回憶 4 ❤️",
"回憶 5 ❤️",
"回憶 6 ❤️",
"回憶 7 ❤️",
"回憶 8 ❤️",
"回憶 9 ❤️",
"回憶 10 ❤️",
"回憶 11 ❤️",
"回憶 12 ❤️",
"回憶 13 ❤️",
"回憶 14 ❤️",
"回憶 15 ❤️",
"回憶 16 ❤️",
"回憶 17 ❤️",
"回憶 18 ❤️",
"回憶 19 ❤️",
"回憶 20 ❤️",
"回憶 21 ❤️"

];

let current = 0;

setInterval(()=>{

    current++;

    if(current >= photos.length){

        current = 0;

    }

    const slide =
    document.getElementById("slide");

    slide.style.opacity = 0;

    setTimeout(()=>{

        slide.src = photos[current];

        document.getElementById("caption")
        .innerHTML = captions[current];

        slide.style.opacity = 1;

    },500);

},4500);

/* 顯示最後彩蛋 */

function showFinal(){

    document.getElementById("finalMessage")
    .style.display = "block";

}

/* 不要按鈕互換 */

const yesBtn =
document.getElementById("yesBtn");

const noBtn =
document.getElementById("noBtn");

/* 點願意 */

yesBtn.addEventListener("click",checkChoice);

noBtn.addEventListener("click",checkChoice);

/* 判斷按了哪個 */

function checkChoice(){

    if(this.innerHTML.includes("K阿")){

        document.body.innerHTML = `

        <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        background:linear-gradient(
        135deg,
        #ffd1dc,
        #ffc0cb
        );
        font-family:Microsoft JhengHei;
        ">

        <h1 style="color:#ff4d6d;">
        ❤️ 陳芊卉 ❤️
        </h1>

        <h2>
        希望以後的每一天，
        都有妳陪我。
        </h2>

        <p>
        1089 天的故事還沒結束 ❤️
        </p>

        </div>

        `;

    }else{

        const temp = yesBtn.innerHTML;

        yesBtn.innerHTML = noBtn.innerHTML;

        noBtn.innerHTML = temp;

    }

}

</script>

</body>

</html>
